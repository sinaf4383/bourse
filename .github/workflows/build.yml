name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" virtualenv setuptools
      - name: Build APK
        shell: bash
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          echo "=== GRADLE ERROR CONTEXT ==="
          grep -n -B2 -A14 "FAILURE: Build failed" build.log | head -60
          echo "=== OTHER ERRORS ==="
          grep -n -i -E "error:|exception|not found|requires java|unsupported" build.log | grep -v "adding:" | grep -v "copy " | tail -20
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
